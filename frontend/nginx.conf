# Serves the SPA and reverse-proxies the API + realtime socket to the backend service,
# so the browser only ever talks to one origin (no CORS, httpOnly cookies work).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 12m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # nginx drops inherited add_header directives in any location that sets its own,
  # so the security headers live in a snippet included wherever headers are added.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Service worker and manifest must always be revalidated so updates roll out.
  location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }

  # Fingerprinted build assets are immutable.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }

  # Public webchat may be embedded in clinics' own websites (embed.js iframe).
  location /c/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors *" always;
    # Serve index.html from THIS location (a fallback URI would re-enter "location /" and its X-Frame-Options).
    try_files /index.html =404;
  }
  location = /embed.js { add_header Cache-Control "public, max-age=300"; add_header Access-Control-Allow-Origin "*"; try_files $uri =404; }

  # SPA fallback.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
