<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alejandro AI — Your intelligent clinic assistant</title>
    <meta name="description" content="Alejandro AI is the AI receptionist and operations assistant for clinics: 24/7 booking, WhatsApp, knowledge base, human handoff and analytics." />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d1a" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Alejandro AI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alejandro AI" />
    <meta property="og:title" content="Alejandro AI — Your intelligent clinic assistant" />
    <meta property="og:description" content="AI receptionist for clinics: appointments, WhatsApp, knowledge base and human handoff." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved appearance/accessibility preferences before first paint (no flash).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('aai.prefs') || '{}');
          var root = document.documentElement;
          var dark = p.theme === 'dark' || (p.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          if (p.highContrast) root.classList.add('hc');
          if (p.reduceMotion) root.classList.add('reduce-motion');
          if (p.readableFont) root.classList.add('readable-font');
          if (p.underlineLinks) root.classList.add('underline-links');
          if (p.fontScale) root.style.setProperty('--font-scale', String(p.fontScale));
          if (p.lang) root.lang = p.lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Alejandro AI requires JavaScript. / Alejandro AI requiere JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
